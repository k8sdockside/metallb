<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>MetalLB address space</title>
        <link rel="stylesheet" href="metallb.css" />
        <!-- The bridge to the app. Served by k8sdockside itself, always at this path. -->
        <script src="/plugin-ui/_sdk/k8sdockside.js"></script>
    </head>
    <body class="page page-space">
        <header class="top">
            <div class="brand">
                <span class="logo" id="logo"></span>
                <div>
                    <h1>Address space</h1>
                    <p id="where" class="faint">Connecting…</p>
                </div>
            </div>
            <label class="search">
                <span id="search-icon"></span>
                <input id="query" type="search" placeholder="Find an address, service or pool" autocomplete="off" spellcheck="false" />
            </label>
            <nav class="top-actions" id="top-actions"></nav>
        </header>

        <p id="error" class="banner error" hidden></p>
        <section id="empty" class="empty" hidden></section>

        <section id="hero" class="hero" hidden></section>
        <section id="attention" class="attention" hidden></section>

        <div class="layout" id="layout" hidden>
            <main id="pools" class="pools"></main>
            <aside id="inspector" class="inspector" aria-live="polite"></aside>
        </div>

        <!-- Classic scripts, not type="module": a sandboxed frame has an opaque
             origin, so a module would be a cross-origin load. -->
        <script src="model.js"></script>
        <script src="kit.js"></script>
        <script src="space.js"></script>
    </body>
</html>
